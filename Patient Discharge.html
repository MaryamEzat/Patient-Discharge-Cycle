<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patient Discharge Management</title>
    <style>
	    :root{
	        --green:#183329;
	        --green2:#274a3b;
	        --bronze:#b67c50;
	        --cream:#f5f0e9;
	        --paper:#fffdfa;
	        --ink:#1d2922;
	        --soft:#657067;
	        --line:#ded6ca;
	        --sage:#e8f0e8;
	        --gold:#fbf0e4;
	        --red:#ad5147;
	        --redbg:#fae9e6;
	        --amber:#a96629;
	        --amberbg:#fcf0df;
	        --blue:#356887;
	        --bluebg:#e7f0f5;
	        --shadow:0 7px 20px rgba(38,30,22,.045);
	        --shadow-strong:0 18px 44px rgba(38,30,22,.14);
	        --radius:14px;
	        --radius-sm:8px;
	    }
	    *{box-sizing:border-box}
	    body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:13px;line-height:1.45}
	    button,input,select,textarea{font:inherit}
	    button{min-height:36px}
	    .hidden{display:none!important}
	    .app-root{min-height:100vh;padding-left:70px}
	    .nav-rail{position:fixed;inset:0 auto 0 0;width:70px;background:var(--green);display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 10px;z-index:80;box-shadow:8px 0 26px rgba(24,51,41,.12)}
	    .rail-mark{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,253,250,.18);background:rgba(255,253,250,.08);display:flex;align-items:center;justify-content:center;color:#f1d4bd;font-size:15px;font-weight:900;letter-spacing:.04em}
	    .main-nav{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:6px}
	    .tab-btn{width:48px;height:48px;padding:0;border:1px solid transparent;border-radius:12px;background:transparent;color:#dfd4c7;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
	    .tab-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
	    .tab-btn:hover{background:rgba(255,253,250,.1);color:var(--paper)}
	    .tab-btn.active{background:var(--paper);color:var(--green);box-shadow:inset 3px 0 0 var(--bronze),0 10px 22px rgba(9,20,15,.18)}
	    .top-context{height:68px;padding:0 26px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;position:sticky;top:0;z-index:50}
	    .header-left{min-width:260px;display:flex;flex-direction:column;gap:1px}
	    .brand{font-size:15px;font-weight:850;color:var(--ink);line-height:1.2;letter-spacing:0}
	    .subtitle{font-size:10px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:var(--bronze)}
	    .context-title{margin-left:auto;display:flex;align-items:center;gap:16px;min-width:0}
	    .context-chip{display:flex;flex-direction:column;gap:1px;min-width:0}
	    .context-label,.eyebrow{font-size:10px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:var(--bronze)}
	    .context-value{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
	    .header-right{display:flex;gap:10px;align-items:center;min-width:0}
	    .icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--green);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
	    .icon-btn:hover{border-color:var(--bronze);background:#faf6f1}
	    .last-updated{font-size:12px;color:var(--soft);white-space:nowrap}
	    .user-info{min-width:0}
	    .user-inline{display:flex;align-items:center;gap:8px;min-width:0}
	    .avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,253,250,.18)}
	    .main{width:100%;max-width:1540px;margin:0 auto;padding:30px 36px 48px}
    .tab-panel{display:block}
	    .section-surface,.worklist,#earlyDraftHeader,#earlyList,.timeline,.current-activity,.activity-form,.patient-summary,.discharge-alerts{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
	    .kpi-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px;margin-bottom:18px}
	    .kpi{min-height:92px;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}
	    .kpi:first-child{background:var(--green);border-color:var(--green);color:var(--paper)}
	    .kpi:first-child .kpi-title{color:#d9b697}
	    .kpi:first-child .kpi-value{color:var(--paper)}
	    .kpi .kpi-title{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.11em;color:var(--bronze)}
	    .kpi .kpi-value{font-size:29px;font-weight:900;color:var(--ink);line-height:1}
    .filters{margin-bottom:12px}
	    .toolbar{min-height:52px;margin-bottom:14px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
	    input,select,textarea{border:1px solid var(--line);border-radius:var(--radius-sm);background:#fffdfa;color:var(--ink);outline:none}
	    input,select{height:36px;padding:0 10px}
	    textarea{padding:9px 10px;resize:vertical}
	    input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--bronze);outline:3px solid rgba(182,124,80,.34);outline-offset:2px}
    .toolbar input{min-width:340px;flex:1}
    .toolbar input[type="date"]{min-width:160px;flex:0 0 auto}
    .toolbar select{min-width:160px}
	    button,.btn-primary{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--green);padding:0 12px;cursor:pointer;font-weight:800}
	    button:hover{background:#faf6f1;border-color:var(--bronze)}
	    .btn-primary,#refreshWorklist{border-color:var(--bronze);background:var(--bronze);color:#fff;box-shadow:none}
	    .btn-primary:hover,#refreshWorklist:hover{background:#a66f46}
	    .btn-submit{border-color:var(--green);background:var(--green);color:var(--paper)}
	    .btn-submit:hover{background:var(--green2);border-color:var(--green2)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .worklist{padding:0;overflow:auto}
    .worklist table,.worklist-table{width:100%;border-collapse:separate;border-spacing:0}
	    .worklist th,.worklist td,.worklist-table th,.worklist-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle;white-space:nowrap}
	    .worklist thead th,.worklist-table thead th{position:sticky;top:0;z-index:1;background:#e5dcd1;color:#4b554d;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}
    .worklist tbody tr,.worklist-table tbody tr{transition:background .12s ease,box-shadow .12s ease}
	    .worklist tbody tr:hover,.worklist-table tbody tr:hover{background:#fff9f2;cursor:pointer}
    .worklist td.patient-cell{white-space:normal}
	    .worklist td.patient-cell .name{font-weight:900;color:var(--ink);text-transform:uppercase;font-size:12px;letter-spacing:.02em}
	    .worklist td.patient-cell .meta{font-size:12px;color:var(--soft);margin-top:2px}
	    .worklist tr.delayed{box-shadow:inset 3px 0 0 var(--red)}
	    .expand-cell{width:44px;text-align:center!important;padding:0 6px!important}
	    .expand-btn{width:30px;height:30px;min-height:30px;padding:0;border-color:transparent;background:transparent;color:var(--soft);font-size:18px;line-height:1}
	    .expand-btn:hover,.expand-btn.active{border-color:var(--line);background:#f7f3ed;color:var(--green)}
	    .steps-row td{padding:0!important;background:#fbf7f1;border-bottom:1px solid var(--line)}
	    .steps-row:hover{background:#fbf7f1!important;cursor:default!important}
	    .steps-subgrid{margin:10px 18px 14px 58px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:10px}
	    .steps-list{display:grid;gap:8px}
	    .step-card{display:grid;grid-template-columns:30px minmax(230px,1fr) minmax(190px,.55fr);gap:10px;align-items:start;padding:10px;border:1px solid #eee6db;border-radius:var(--radius-sm);background:#fffdfa}
	    .step-card:hover{background:#fff9f2}
	    .step-index{width:24px;height:24px;border-radius:50%;background:var(--bluebg);border:1px solid #d3e2eb;color:var(--blue);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
	    .step-main-title{font-size:13px;font-weight:900;color:var(--ink)}
	    .step-main-sub{font-size:12px;color:var(--soft);margin-top:3px}
	    .step-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
	    .step-detail-grid{grid-column:2/4;display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:6px 18px;padding-top:2px}
	    .step-detail{font-size:12px;color:var(--soft);min-width:0;overflow-wrap:anywhere}
	    .step-detail strong{display:inline-block;margin-right:5px;color:#4b554d;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
	    .steps-footer{padding:8px 2px 0;color:var(--soft);font-size:12px}
	    .steps-loading{padding:16px;color:var(--soft)}
    .status-badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid transparent;white-space:nowrap}
	    .status-success{background:var(--sage);border-color:#d3dfd3;color:#356140}
	    .status-info{background:var(--bluebg);border-color:#d3e2eb;color:var(--blue)}
	    .status-warning{background:var(--amberbg);border-color:#ecd6bb;color:var(--amber)}
	    .status-danger{background:var(--redbg);border-color:#edcfc9;color:var(--red)}
	    .status-forward{background:var(--gold);border-color:#ead7c6;color:var(--green2)}
    .patient-panel{background:transparent}
    .patient-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    #backToWorklist{padding:0 12px}
	    .patient-header{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
    .patient-body{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:14px;align-items:start}
    .early-workspace{display:flex;flex-direction:column;gap:14px}
    .early-draft-overview{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;display:grid;grid-template-columns:minmax(220px,1.1fr) repeat(5,minmax(100px,.8fr)) minmax(120px,auto);gap:14px;align-items:center}
    .early-overview-title{min-width:0}
    .early-overview-title .summary-name{font-size:18px}
    .early-overview-title .summary-ref{font-size:12px}
    .early-metric{border-left:1px solid #eee6db;padding-left:14px;min-width:0}
    .early-metric .summary-label{margin-bottom:4px}
    .early-metric .summary-value{font-size:13px;font-weight:850}
    .early-submit-area{display:flex;justify-content:flex-end;align-items:center}
    .early-draft-layout{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:14px;align-items:start}
    .early-add-panel,.early-patient-panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
    .early-add-panel{border-left:4px solid var(--bronze);position:sticky;top:84px}
    .early-patient-panel{min-width:0}
    .early-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    .early-panel-title{font-size:16px;font-weight:900;color:var(--ink)}
    .patient-summary{padding:14px;position:sticky;top:84px}
	    .summary-title{padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
	    .summary-name{font-size:18px;font-weight:900}
	    .summary-ref{font-size:12px;color:var(--soft);margin-top:2px}
	    .summary-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid #eee6db}
    .summary-row:last-child{border-bottom:0}
	    .summary-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--bronze)}
	    .summary-value{font-size:13px;color:var(--ink);font-weight:700;min-width:0;overflow-wrap:anywhere}
    .patient-main{min-width:0;display:grid;grid-template-columns:minmax(320px,.95fr) minmax(380px,1.2fr);gap:14px}
    .discharge-alerts{grid-column:1/-1;padding:14px;min-height:220px}
	    .subgrid-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
	    .subgrid-title{font-size:16px;font-weight:900;color:var(--ink)}
	    .subgrid-actions{display:flex;gap:8px;align-items:center}
	    .subgrid-empty{padding:48px 12px;text-align:center;color:var(--soft)}
	    .quick-create-modal{position:fixed;right:0;top:0;bottom:0;width:min(620px,94vw);background:var(--paper);z-index:1000;box-shadow:var(--shadow-strong);border-left:1px solid var(--line);display:flex;flex-direction:column}
	    .quick-create-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
	    .quick-create-title{font-size:24px;font-weight:900;color:var(--ink)}
	    .quick-create-body{padding:24px;display:flex;flex-direction:column;gap:16px}
	    .lookup-pill{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:36px;padding:6px 10px;background:#eef4fb;border-radius:var(--radius-sm);color:#0f5ca8;font-weight:800}
	    .lookup-pill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .current-activity,.activity-form,.timeline{padding:14px}
	    .current-activity{border-left:4px solid var(--bronze)}
    .timeline{grid-row:span 2}
	    .panel-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--bronze);margin-bottom:8px}
	    .activity-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
	    .activity-title{font-size:17px;font-weight:900;color:var(--ink)}
	    .activity-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--soft)}
    .timeline-steps{position:relative;padding-left:25px}
	    .timeline-steps::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;width:1px;background:var(--line)}
    .timeline-node{position:relative;padding:9px 0 11px}
	    .timeline-node .node-dot{position:absolute;left:-24px;top:12px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--line)}
	    .node-completed .node-dot{background:#356140;border-color:var(--sage)}
	    .node-current .node-dot{background:var(--bronze);border-color:#ead7c6;box-shadow:0 0 0 4px rgba(182,124,80,.13)}
	    .node-pending .node-dot{background:var(--amber);border-color:var(--amberbg)}
	    .node-delayed .node-dot{background:var(--red);border-color:var(--redbg)}
	    .timeline-title{font-weight:900;color:var(--ink);font-size:12px;letter-spacing:.02em;text-transform:uppercase}
	    .timeline-meta{font-size:12px;color:var(--soft);margin-top:2px}
    .activity-form-inner{display:flex;flex-direction:column;gap:12px}
    .form-row{display:grid;grid-template-columns:135px minmax(0,1fr);gap:10px;align-items:start}
	    .form-row .label{padding-top:8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--bronze)}
    .form-row input,.form-row select,.form-row textarea{width:100%}
    .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
	    .lookup-wrap{position:relative;width:100%}
	    .lookup-input-wrap{position:relative}
	    .lookup-input-wrap input{padding-right:36px}
	    .lookup-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft);pointer-events:none}
	    .lookup-results{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-strong);overflow:hidden;max-height:250px;overflow-y:auto}
	    .lookup-results.hidden{display:none!important}
	    .lookup-result{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #eee6db;background:var(--paper);cursor:pointer;color:var(--ink)}
	    .lookup-result:last-child{border-bottom:0}
	    .lookup-result:hover,.lookup-result.selected{background:#fff9f2}
	    .lookup-result-icon{width:18px;height:18px;border:1px solid var(--soft);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);font-size:12px;line-height:1}
	    .lookup-result-label{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	    .lookup-state{padding:10px 12px;color:var(--soft);background:var(--paper)}
	    .team-result,.patient-result{padding:8px 10px;margin-top:4px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);cursor:pointer}
	    .team-result:hover,.patient-result:hover,.patient-result.selected{background:#fff9f2;border-color:var(--bronze)}
	    .patient-result .name{font-weight:900;color:var(--ink);text-transform:uppercase}
	    .patient-result .meta{font-size:12px;color:var(--soft);margin-top:2px}
	    .draft-form{display:flex;flex-direction:column;gap:12px}
	    .draft-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
	    .draft-patient-list{max-height:260px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
	    .draft-existing{max-height:560px;overflow:auto}
	    .draft-existing .worklist-table th,.draft-existing .worklist-table td{padding:9px 10px}
	    .draft-existing .patient-name-col{min-width:210px;white-space:normal}
	    .draft-existing .patient-name-col .name{font-weight:850;text-transform:uppercase;font-size:12px}
	    #earlyDraftHeader{padding:14px 18px;margin-bottom:12px}
    #earlyList{padding:0;overflow:auto}
	    .loading,.empty-state{padding:18px;color:var(--soft)}
	    .small{font-size:12px;color:var(--soft)}
	    #dataverseError{max-width:420px;text-align:right;color:var(--red)}
	    .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0;border-radius:17px;box-shadow:var(--shadow-strong);z-index:1000;max-width:90%;width:680px;border:1px solid var(--line);overflow:hidden}
	    .modal>div{padding:21px}
	    .modal-backdrop{position:fixed;inset:0;background:rgba(13,28,20,.62);z-index:900}
	    html,body,#app,.app-root{overflow-x:hidden!important;max-width:100%!important;width:100%!important;box-sizing:border-box!important}
	    .last-updated{display:inline-block!important;visibility:visible!important;opacity:1!important;color:var(--ink)!important;font-weight:600!important}
	    .context-chip{flex:1 1 0px!important;min-width:0!important}
	    .context-chip-left{text-align:left!important}
	    .context-chip-center{text-align:center!important}
	    .context-chip-right{text-align:right!important}
	    .form-row,.activity-form,.activity-form-inner,fieldset,.select-wrapper,.lookup-wrap,.lookup-input-wrap,select,input,textarea{width:100%!important;max-width:100%!important;box-sizing:border-box!important}
	    select{display:block!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px;padding-right:32px!important}
	    select option{width:100%!important;max-width:100%!important;box-sizing:border-box!important}
	    .lookup-results{position:absolute!important;left:0!important;right:0!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;z-index:9999!important}
	    @media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,minmax(150px,1fr))}.patient-body,.patient-main,.early-draft-layout{grid-template-columns:1fr}.early-draft-overview{grid-template-columns:repeat(2,minmax(150px,1fr))}.early-overview-title{grid-column:1/-1}.early-add-panel{position:static}.patient-summary{position:static}.header-left{min-width:auto}.top-context{height:auto;min-height:68px;align-items:flex-start;padding:12px 16px;flex-wrap:wrap}.context-title{margin-left:0;width:100%;justify-content:space-between}.header-right{margin-left:auto}}

                console.debug('Discharge Alerts metadata resolution started', { parentEntity: CONFIG.tables.patient });
                const definitions = await this.getEntityDefinitions();
                const definitionMap = new Map(definitions.map(entity => [entity.LogicalName, entity]));
                const parentDef = definitionMap.get(CONFIG.tables.patient) || {};
                const relationships = await this.getOneToManyRelationships(CONFIG.tables.patient);
                const alertRelationships = relationships
                    .filter(rel => rel.ReferencedEntity === CONFIG.tables.patient && rel.ReferencingEntity)
                    .filter(rel => {
                        const entityName = String(rel.ReferencingEntity || '').toLowerCase();
                        const entityDisplayName = String(getLocalizedLabel((definitionMap.get(rel.ReferencingEntity) || {}).DisplayName) || '').toLowerCase();
                        const schemaName = String(rel.SchemaName || '').toLowerCase();
                        const text = `${entityName} ${entityDisplayName} ${schemaName}`;
                        return text.includes('alert') || text.includes('discharge');
                    })
                    .sort((a, b) => {
                        const aName = `${a.ReferencingEntity || ''} ${a.SchemaName || ''}`.toLowerCase();
                        const bName = `${b.ReferencingEntity || ''} ${b.SchemaName || ''}`.toLowerCase();
                        const aScore = aName.includes('discharge') ? 0 : 1;
                        const bScore = bName.includes('discharge') ? 0 : 1;
                        return aScore - bScore || aName.localeCompare(bName);
                    });
                const candidates = alertRelationships.filter((rel, index, all) =>
                    index === all.findIndex(item => item.ReferencingEntity === rel.ReferencingEntity && item.ReferencingAttribute === rel.ReferencingAttribute)
                );
                console.debug('Discharge Alerts candidate relationships', candidates);

                const failures = [];
                for (const rel of candidates) {
                    const logicalName = rel.ReferencingEntity;
                    const entityDef = definitionMap.get(logicalName);
                    if (!entityDef) {
                        failures.push({ logicalName, relationship: rel.SchemaName, reason: 'Referencing entity was not present in EntityDefinitions' });
                        continue;
                    }
                    const attrs = await this.getEntityAttributes(logicalName);
                    if (!attrs || attrs.size === 0) {
                        failures.push({ logicalName, relationship: rel.SchemaName, reason: 'No attributes returned' });
                        continue;
                    }
                    const attrMeta = await this.getAttributeMetadata(logicalName);
                    const lookupAttrs = await this.getLookupAttributes(logicalName);
                    const patientLookup = lookupAttrs.find(attr => attr.LogicalName === rel.ReferencingAttribute) ||
                        lookupAttrs.find(attr => (attr.Targets || []).includes(CONFIG.tables.patient));
                    if (!patientLookup) {
                        failures.push({ logicalName, relationship: rel.SchemaName, reason: 'No lookup targeting Patient Discharge was found' });
                        continue;
                    }
                    const lookupLogical = patientLookup.LogicalName || rel.ReferencingAttribute;
                    const lookupSchema = patientLookup.SchemaName || lookupLogical;
                    const lookupValue = `_${lookupLogical}_value`;
                    const id = entityDef.PrimaryIdAttribute || cfg.idAliases.find(field => attrs.has(field)) || `${logicalName}id`;
                    const primaryName = entityDef.PrimaryNameAttribute || '';
                    const title = cfg.titleAliases.find(field => attrs.has(field)) || primaryName;
                    const comment = cfg.commentAliases.find(field => attrs.has(field)) ||
                        attrMeta.find(attr => /comment|description/i.test(`${attr.LogicalName || ''} ${getLocalizedLabel(attr.DisplayName)}`))?.LogicalName ||
                        title;
                    const status = cfg.statusAliases.find(field => attrs.has(field));
                    const severity = cfg.severityAliases.find(field => attrs.has(field)) ||
                        attrMeta.find(attr => /severity|priority|type/i.test(`${attr.LogicalName || ''} ${getLocalizedLabel(attr.DisplayName)}`))?.LogicalName;
                    const selectFields = [...new Set([id, title, comment, status, severity, lookupValue, 'createdon', '_createdby_value'].filter(Boolean))];
                    this._alertSchema = {
                        logicalName,
                        displayName: getLocalizedLabel(entityDef.DisplayName) || logicalName,
                        entitySet: entityDef.EntitySetName || await this.getEntitySetName(logicalName),
                        primaryIdAttribute: id,
                        primaryNameAttribute: primaryName,
                        id,
                        title,
                        comment,
                        status,
                        severity,
                        lookupLogical,
                        lookupSchema,
                        lookupValue,
                        bindName: lookupSchema,
                        relationshipSchemaName: rel.SchemaName,
                        relationship: rel,
                        lookupAttributes: lookupAttrs,
                        selectFields
                    };
                    console.debug('Resolved Discharge Alert schema', {
                        parentEntity: CONFIG.tables.patient,
                        parentEntitySet: parentDef.EntitySetName,
                        relationship: rel,
                        alertLogicalName: logicalName,
                        alertDisplayName: this._alertSchema.displayName,
                        alertEntitySetName: this._alertSchema.entitySet,
                        primaryIdAttribute: id,
                        primaryNameAttribute: primaryName,
                        patientDischargeLookup: lookupLogical,
                        lookupTargets: patientLookup.Targets,
                        allLookups: lookupAttrs
                    });
                    return this._alertSchema;
                }
                console.debug('Discharge Alerts metadata resolution failed', { parentEntity: CONFIG.tables.patient, relationships, candidates, failures });
                const err = new Error('Unable to resolve Discharge Alert table schema from Patient Discharge relationships');
                err.relationships = relationships;
                err.candidates = candidates;
                err.failures = failures;
                throw err;
            },

                const q = { $top: 50 };

            async addEarlyDischargePatient(parentId, payload) {
                const id = normalizeGuid(parentId);
                const entitySet = await this.getEntitySetName(CONFIG.tables.earlyIpd);
                const parentEntitySet = await this.getEntitySetName(CONFIG.tables.early);
                const inpatientEntitySet = await this.getEntitySetName(CONFIG.tables.inpatient);
                const url = `${this.getClientUrl()}/api/data/${CONFIG.api.version}/${entitySet}`;
                const patientCodeLookupId = normalizeGuid(payload.__inpatientId);
                const basePayload = Object.assign({}, payload);
                delete basePayload.__inpatientId;
                const parentLookups = CONFIG.lookupBindings.earlyIpdParent;
                const patientLookups = patientCodeLookupId ? CONFIG.lookupBindings.earlyIpdPatientCode : [null];
                let lastError = null;
                for (const parentLookup of parentLookups) {
                    for (const patientLookup of patientLookups) {
                        let nextPayload = Object.assign({}, basePayload, { [`${parentLookup}@odata.bind`]: `/${parentEntitySet}(${id})` });
                        if (patientLookup && patientCodeLookupId) nextPayload[`${patientLookup}@odata.bind`] = `/${inpatientEntitySet}(${patientCodeLookupId})`;
                        for (let attempt = 0; attempt < 8; attempt++) {
                            try {
                                return await this.fetchJson(url, { method: 'POST', body: JSON.stringify(nextPayload) });
                            } catch (err) {
                                lastError = err;
                                const missing = this.parseMissingProperty(err);
                                const badKey = missing ? Object.keys(nextPayload).find(key => key === missing || key.toLowerCase() === missing.toLowerCase() || key.toLowerCase().indexOf(`${missing.toLowerCase()}@`) === 0) : null;
                                if (!badKey) throw err;
                                if (badKey.indexOf('@odata.bind') !== -1 && (badKey.toLowerCase().includes('earlydischarge') || badKey.toLowerCase().includes('patientcode'))) break;
                                delete nextPayload[badKey];
                                console.warn('Retrying early discharge patient create without missing property', missing);
                            }
                        }
                    }
                }
                throw lastError || new Error('Unable to create early discharge patient row');
            },

        function sortPatientsNewestFirst(rows) {
            const sortTime = (row) => {
                const candidates = [row[CONFIG.fields.lastActivity], row.modifiedon, row[CONFIG.fields.createdOn]];
                for (const value of candidates) {
                    const time = new Date(value || 0).getTime();
                    if (!Number.isNaN(time) && time > 0) return time;
                }
                return 0;
            };
            return rows.slice().sort((a, b) => sortTime(b) - sortTime(a));

        function getLocalDateKey(value) {
            if (isBlank(value)) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function getCachedActivities(patientId) {
            const id = normalizeGuid(patientId);
            if (!id) return [];
            const cached = State.activityCache[id];
            if (cached) return await cached;
            const promise = DataverseService.getActivities(id)
                .then(response => safeGet(response, 'value', []))
                .catch(err => {
                    delete State.activityCache[id];
                    throw err;
                });
            State.activityCache[id] = promise;
            const activities = await promise;
            State.activityCache[id] = activities;
            return activities;
        }

        function prefetchVisibleSteps(rows) {
            const ids = rows.slice(0, 8)
                .map(r => normalizeGuid(r[CONFIG.fields.id] || r[CONFIG.fields.id.toLowerCase()]))
                .filter(Boolean)
                .filter(id => !State.activityCache[id]);
            ids.forEach((id, index) => {
                setTimeout(() => {
                    getCachedActivities(id).catch(err => console.debug('Step prefetch failed', id, err));
                }, index * 120);
            });
        }

        function getCurrentStepFromActivities(activities) {
            if (!activities || !activities.length) return '';
            const current = activities.find(i => !choiceEquals(i.crad2_status, CONFIG.choices.activityAction.cleared)) || activities[activities.length - 1];
            return current ? displayValue(current, 'crad2_subject', null, '') : '';
        }

        function enrichVisibleCurrentSteps(rows) {
            rows.slice(0, 30).forEach((row, index) => {
                const rowId = row[CONFIG.fields.id] || row[CONFIG.fields.id.toLowerCase()] || '';
                const id = normalizeGuid(rowId);
                if (!id) return;
                setTimeout(() => {
                    getCachedActivities(id).then(activities => {
                        const subject = getCurrentStepFromActivities(activities);
                        if (!subject) return;
                        document.querySelectorAll(`.current-step-cell[data-patient-id="${escapeCssValue(rowId)}"]`).forEach(cell => {
                            cell.textContent = subject;
                        });
                    }).catch(err => console.debug('Current step enrichment failed', id, err));
                }, 80 + index * 90);
            });
        }

        async function toggleWorklistSteps(patientRecord, detailsRow, button) {
            const isOpen = !detailsRow.classList.contains('hidden');
            if (isOpen) {
                detailsRow.classList.add('hidden');
                button.classList.remove('active');
                button.textContent = '›';
                button.setAttribute('aria-label', 'Show discharge steps');
                return;
            }
            detailsRow.classList.remove('hidden');
            button.classList.add('active');
            button.textContent = '⌄';
            button.setAttribute('aria-label', 'Hide discharge steps');
            if (detailsRow.dataset.loaded === 'true') return;
            const patientId = patientRecord[CONFIG.fields.id] || patientRecord[CONFIG.fields.id.toLowerCase()];
            try {
                const activities = await getCachedActivities(patientId);
                renderWorklistSteps(detailsRow, activities);
                detailsRow.dataset.loaded = 'true';
            } catch (err) {
                console.error('Unable to load discharge steps', err);
                detailsRow.innerHTML = '<td colspan="32"><div class="steps-loading">Unable to load steps.</div></td>';
            }
        }

        function renderWorklistSteps(detailsRow, activities) {
            if (!activities.length) {
                detailsRow.innerHTML = '<td colspan="32"><div class="steps-loading">No discharge steps found.</div></td>';
                return;
            }
            const rows = activities.map((activity, index) => {
                const subject = displayValue(activity, 'crad2_subject', null, '-');
                const owner = safeGet(activity, '_ownerid_value@OData.Community.Display.V1.FormattedValue', '') || safeGet(activity, 'ownerid@OData.Community.Display.V1.FormattedValue', '') || safeGet(activity, 'crad2_owner@OData.Community.Display.V1.FormattedValue', '');
                const action = displayChoice(activity, CONFIG.tables.activity, 'crad2_status', '-');
                const comment = displayValue(activity, 'new_comment', null, '-');
                const delayReason = displayValue(activity, '_and_delayreason_value', null, '-');
                const start = displayDateTime(activity, 'and_startdate', '-');
                const pending = displayDateTime(activity, 'crda1_pendingdate', '-');
                const stepNumber = index + 1;
                const details = [
                    ['Comment', comment],
                    ['Delay Reason', delayReason],
                    ['Start Date', start],
                    ['Pending Date', pending]
                ].filter(([, value]) => !isBlank(value) && value !== '-').map(([label, value]) => `<div class="step-detail"><strong>${escapeHtml(label)}</strong>${escapeHtml(value)}</div>`).join('');
                return `
                    <div class="step-card">
                        <div class="step-index">${stepNumber}</div>
                        <div>
                            <div class="step-main-title">${escapeHtml(subject)}</div>
                            <div class="step-main-sub">${escapeHtml(owner || 'No owner shown')}</div>
                        </div>
                        <div class="step-meta">
                            <span class="status-badge ${getStatusClass(action, activity.crad2_status)}">${escapeHtml(action || '-')}</span>
                            <span class="small">${escapeHtml(start || '-')}</span>
                        </div>
                        ${details ? `<div class="step-detail-grid">${details}</div>` : ''}
                    </div>`;
            }).join('');
            detailsRow.innerHTML = `
                <td colspan="32">
                    <div class="steps-subgrid">
                        <div class="steps-list">${rows}</div>
                        <div class="steps-footer">Rows: ${activities.length}</div>
                    </div>
                </td>`;
        }

            const isRequestInitiation = normalized.includes(CONFIG.subjectAliases.requestInitiation);
            const isFinancialDischarge = normalized.includes(CONFIG.subjectAliases.financialDischarge);
            const isPhysicalDischarge = normalized.includes(CONFIG.subjectAliases.physicalDischarge);
            const needsDelayReason = isRequestInitiation || normalized.includes(CONFIG.subjectAliases.homeMedications);
            form.innerHTML = `<div><div class="panel-label">Activity Update</div><div class="activity-title">${escapeHtml(activitySubject)}</div><div class="small">Stage: ${escapeHtml(activityStage)}</div></div>`;

            const controls = {};
            addReadOnlyField(form, 'Subject', activitySubject);
            if (isRequestInitiation) {
                const dischargeInstructionsField = !isBlank(activity.new_dischargeinstructionsss) ? 'new_dischargeinstructionsss' : 'new_dischargeinstructions';
                const pharmacyReturnField = !isBlank(activity.crad2_pharmacyreturn) ? 'crad2_pharmacyreturn' : 'new_pharmacyreturn';
                controls.dischargeInstructions = addYesNo12Field(form, 'Discharge Instructions', dischargeInstructionsField, null, true);
                controls.pharmacyReturn = addYesNo12Field(form, 'Pharmacy Return', pharmacyReturnField, null, true);
                controls.followUpDate = addDateField(form, 'Follow Up Date', 'new_followupdate', null);
            }

            controls.action = addActionField(form, null);
            if (needsDelayReason) controls.delayReason = addDelayReasonLookupField(form, Object.assign({}, activity, { _and_delayreason_value: null }), true);

            const physicalFields = [];
            if (isPhysicalDischarge) {
                physicalFields.push(addPhysicalQuestionField(form, 'Received the discharge summary?', 'and_didyoureceivethedischargesummary', null));
                physicalFields.push(addPhysicalQuestionField(form, 'Received home medications?', 'and_didyoureceiveyourhomemedications', null));
                physicalFields.push(addPhysicalQuestionField(form, 'Has a follow-up appointment?', 'and_doyouhaveafollowupappointment', null));
            }

            controls.comment = addTextAreaField(form, 'Comment', 'new_comment', activity.new_comment || '');
            const fileInput = addAttachmentField(form, activity);
            const forwardRow = addForwardTeamField(form);
            addReadOnlyField(form, 'Owner', displayValue(activity, '_ownerid_value', null, '') || displayValue(activity, 'crad2_owner', null, ''));
            addReadOnlyField(form, 'Previous Activity', displayValue(activity, '_crad2_previousactivity_value', null, '') || displayValue(activity, 'crad2_previousactivity', null, ''));

            const actions = document.createElement('div');
            actions.className = 'form-actions';
            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn-primary';
            saveBtn.textContent = 'Save Activity';
            actions.appendChild(saveBtn);
            form.appendChild(actions);

            const syncConditionalFields = () => {
                const action = parseInt(controls.action.value);
                forwardRow.classList.toggle('hidden', action !== CONFIG.choices.activityAction.forwardToTeam);
                physicalFields.forEach(row => row.classList.toggle('hidden', action !== CONFIG.choices.activityAction.cleared));
            };
            controls.action.addEventListener('change', syncConditionalFields);
            syncConditionalFields();

            saveBtn.addEventListener('click', async () => {
                const action = parseInt(controls.action.value);
                if (!action) { showAppMessage('Action required', 'Select an activity action before saving.', 'error'); return; }
                if (needsDelayReason && !controls.delayReason.dataset.selectedDelayReasonId) { showAppMessage('Delay Reason required', 'Select a delay reason from the lookup before saving this activity.', 'error'); return; }
                if (isRequestInitiation) {
                    if (!controls.dischargeInstructions.value || !controls.pharmacyReturn.value) { showAppMessage('Required fields missing', 'Discharge Instructions and Pharmacy Return are required.', 'error'); return; }
                }
                if (action === CONFIG.choices.activityAction.cleared && isPhysicalDischarge) {
                    const missingPhysical = physicalFields.some(row => !row.querySelector('select').value);
                    if (missingPhysical) { showAppMessage('Confirmations required', 'All Physical Discharge confirmations are required before clearing.', 'error'); return; }
                }

                const payload = collectActivityPayload(form);
                if (isRequestInitiation) {
                    const dischargeInstructionsValue = controls.dischargeInstructions.value === 'true';
                    const pharmacyReturnValue = controls.pharmacyReturn.value === 'true';
                    const activityTypes = await DataverseService.getEntityAttributeTypes(CONFIG.tables.activity);
                    applyTypedYesNoPayload(payload, ['new_dischargeinstructions', 'new_dischargeinstructionsss'], dischargeInstructionsValue, activityTypes);
                    applyTypedYesNoPayload(payload, ['new_pharmacyreturn', 'crad2_pharmacyreturn'], pharmacyReturnValue, activityTypes);
                }
                payload.crad2_status = action;
                if (action === CONFIG.choices.activityAction.cleared) payload[CONFIG.fields.actionDate] = new Date().toISOString();
                if (action === CONFIG.choices.activityAction.forwardToTeam) {
                    const selectedTeamId = forwardRow.dataset.selectedTeamId;
                    if (!selectedTeamId) { showAppMessage('Team required', 'Please select a team to forward this activity to.', 'error'); return; }
                    if (isPhysicalDischarge) applyPhysicalForwardDefaults(payload, activity);
                    const teamBinding = await DataverseService.resolveActivityTeamBinding();
                    payload[`${teamBinding}@odata.bind`] = `/teams(${selectedTeamId})`;
                }

                try {
                    disable(saveBtn, true);
                    const patientId = State.selectedPatient[CONFIG.fields.id];
                    const beforeSave = await captureDischargeWorkflowState(patientId);
                    console.debug('Activity being saved', {
                        activityId: activity.crad2_dischargeactivityid,
                        subject: activitySubject,
                        oldAction: activity.crad2_status,
                        newAction: action,
                        delayReasonId: controls.delayReason ? controls.delayReason.dataset.selectedDelayReasonId : '',
                        payload,
                        activityCountBefore: safeGet(beforeSave, 'activities.length', 0),
                        currentStepBefore: beforeSave.parent ? beforeSave.parent[CONFIG.fields.currentStep] : null
                    });
                    await DataverseService.updateActivityWithLookups(activity.crad2_dischargeactivityid, payload, { delayReasonId: controls.delayReason ? controls.delayReason.dataset.selectedDelayReasonId : '' });
                    console.debug('PATCH success', activity.crad2_dischargeactivityid);
                    delete State.activityCache[normalizeGuid(patientId)];
                    State.patientsLoaded = false;
                    State.dashboardPatientsLoaded = false;
                    showUpdatingWorkflow();
                    await delay(500);
                    const baseline = await captureDischargeWorkflowState(patientId);
                    console.debug('Polling started', {
                        activityCountAfterPatch: safeGet(baseline, 'activities.length', 0),
                        currentStepAfterPatch: baseline.parent ? baseline.parent[CONFIG.fields.currentStep] : null
                    });
                    applyDischargeWorkflowState(baseline);
                    const changedDuringSave = workflowSignal(beforeSave, activity.crad2_dischargeactivityid) !== workflowSignal(baseline, activity.crad2_dischargeactivityid);
                    if (changedDuringSave) $id('modalRoot').innerHTML = '';
                    else {
                        const result = await pollDischargeWorkflow(patientId, baseline, { targetActivityId: activity.crad2_dischargeactivityid });
                        applyDischargeWorkflowState(result.snapshot);
                        console.debug('Polling finished', {
                            changed: result.changed,
                            activityCountAfterPolling: safeGet(result.snapshot, 'activities.length', 0),
                            currentStepAfterPolling: result.snapshot && result.snapshot.parent ? result.snapshot.parent[CONFIG.fields.currentStep] : null
                        });
                        if (result.changed) $id('modalRoot').innerHTML = '';
                        else showWorkflowStillProcessing();
                    }
                } catch (err) {
                    console.error(err);
                    showAppMessage('Save failed', 'Unable to save activity.', 'error');
                } finally {
                    disable(saveBtn, false);
                }
            });

            fileInput.addEventListener('change', async () => {
                const f = fileInput.files[0];
                if (!f) return;
                try { delete State.activityCache[normalizeGuid(State.selectedPatient[CONFIG.fields.id])]; await DataverseService.uploadActivityFile(activity.crad2_dischargeactivityid, f); showAppMessage('File uploaded', 'The attachment was uploaded successfully.', 'success'); await loadPatientActivities(State.selectedPatient[CONFIG.fields.id]); }
                catch (e) { console.error(e); showAppMessage('Upload failed', 'File upload failed.', 'error'); }
            });

            const teamInput = forwardRow.querySelector('input');
            const teamResults = forwardRow.querySelector('.team-results');
            const teamWrap = forwardRow.querySelector('.lookup-wrap');
            const closeTeamResults = () => teamResults.classList.add('hidden');
            const setTeamResultsState = (message) => {
                teamResults.innerHTML = `<div class="lookup-state">${escapeHtml(message)}</div>`;
                teamResults.classList.remove('hidden');
            };
            const renderTeamResults = (teams) => {
                teamResults.innerHTML = teams.map(t => `<div class="lookup-result" data-id="${escapeHtml(t.teamid)}"><span class="lookup-result-icon">+</span><span class="lookup-result-label">${escapeHtml(t.name)}</span></div>`).join('') || '<div class="lookup-state">No teams</div>';
                teamResults.classList.remove('hidden');
                teamResults.querySelectorAll('.lookup-result').forEach(node => node.addEventListener('click', () => {
                    forwardRow.dataset.selectedTeamId = node.dataset.id;
                    teamInput.value = node.querySelector('.lookup-result-label').textContent;
                    closeTeamResults();
                }));
            };
            const loadTeamResults = async (q) => {
                setTeamResultsState('Searching...');
                try {
                    const r = await DataverseService.searchTeams(q);
                    renderTeamResults(safeGet(r, 'value', []));
                } catch (e) {
                    console.error('Team search failed', e);
                    setTeamResultsState('Team search failed');
                }
            };
            const debouncedTeamLoad = debounce((q) => loadTeamResults(q), 350);
            teamInput.addEventListener('input', (e) => {
                forwardRow.dataset.selectedTeamId = '';
                debouncedTeamLoad(e.target.value.trim());
            });
            teamInput.addEventListener('focus', () => loadTeamResults(teamInput.value.trim()));
            teamInput.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter') return;
                event.preventDefault();
                loadTeamResults(teamInput.value.trim());
            });
            document.addEventListener('click', (event) => {
                if (!teamWrap.contains(event.target)) closeTeamResults();
            });

            el.appendChild(form);
        }

        function addFieldShell(form, labelText, required = false) {
            const row = document.createElement('div');
            row.className = 'form-row';
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = required ? `${labelText} *` : labelText;
            row.appendChild(label);
            form.appendChild(row);
            return row;
        }

        function addReadOnlyField(form, labelText, value) {
            const row = addFieldShell(form, labelText);
            const input = document.createElement('input');
            input.value = isBlank(value) ? '-' : value;
            input.disabled = true;
            row.appendChild(input);
            return input;
        }

        function addChoiceField(form, labelText, field, value, choices, required = false) {
            const row = addFieldShell(form, labelText, required);
            const select = document.createElement('select');
            select.name = field;
            select.dataset.field = field;
            select.dataset.type = 'number';
            select.innerHTML = '<option value="">---</option>' + Object.entries(choices).map(([key, label]) => `<option value="${escapeHtml(key)}">${escapeHtml(label)}</option>`).join('');
            if (!isBlank(value)) select.value = String(value);
            row.appendChild(select);
            return select;
        }

        function addYesNo12Field(form, labelText, field, value, required = false) {
            if (isBooleanActivityField(field)) return addBooleanYesNoField(form, labelText, field, value, required);
            return addChoiceField(form, labelText, field, value, CHOICE_MAPS.yesNo12, required);
        }

        function applyTypedYesNoPayload(payload, fields, isYes, typeMap) {
            fields.forEach(field => {
                delete payload[field];
                const type = String(typeMap[field] || '').toLowerCase();
                if (!type) return;
                if (type === 'boolean') payload[field] = !!isYes;
                else payload[field] = isYes ? 1 : 2;
            });
        }

        function isBooleanActivityField(field) {
            return ['new_dischargeinstructions', 'new_dischargeinstructionsss', 'new_pharmacyreturn', 'crad2_pharmacyreturn', 'new_homemedications', 'crad2_homemedications'].includes(field);
        }

        function addBooleanYesNoField(form, labelText, field, value, required = false) {
            const row = addFieldShell(form, labelText, required);
            const select = document.createElement('select');
            select.name = field;
            select.dataset.field = field;
            select.dataset.type = 'boolean';
            select.innerHTML = '<option value="">---</option><option value="true">Yes</option><option value="false">No</option>';
            if (!isBlank(value)) {
                if (value === false || String(value).trim().toLowerCase() === 'false' || String(value) === '2' || String(value) === '0') select.value = 'false';
                else select.value = 'true';
            }
            row.appendChild(select);
            return select;
        }

        function addPhysicalQuestionField(form, labelText, field, value) {
            const row = addFieldShell(form, labelText, true);
            const select = document.createElement('select');
            select.name = field;
            select.dataset.field = field;
            select.dataset.type = 'number';
            select.innerHTML = `<option value="">--Select--</option><option value="${CONFIG.choices.yesNoNotDone.yes}">Yes</option><option value="${CONFIG.choices.yesNoNotDone.no}">No</option><option value="${CONFIG.choices.yesNoNotDone.notDone}">Not Done</option>`;
            if (!isBlank(value)) select.value = String(value);
            row.appendChild(select);
            return row;
        }

        function addActionField(form, value) {
            return addChoiceField(form, 'Action', 'crad2_status', value, CHOICE_MAPS.activityAction, true);
        }

        function addDateField(form, labelText, field, value) {
            const row = addFieldShell(form, labelText);
            const input = document.createElement('input');
            input.type = 'date';
            input.name = field;

            const row = addFieldShell(form, labelText, required);

        function addDelayReasonLookupField(form, activity, required = false) {
            const row = addFieldShell(form, 'Delay Reason', required);
            row.dataset.selectedDelayReasonId = normalizeGuid(activity._and_delayreason_value) || '';
            const wrap = document.createElement('div');
            wrap.className = 'lookup-wrap';
            const inputWrap = document.createElement('div');
            inputWrap.className = 'lookup-input-wrap';
            const input = document.createElement('input');
            input.placeholder = 'Look for Delay Reason';
            input.value = row.dataset.selectedDelayReasonId ? displayValue(activity, '_and_delayreason_value', null, '') : '';
            const icon = document.createElement('span');
            icon.className = 'lookup-icon';
            icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>';
            const results = document.createElement('div');
            results.className = 'lookup-results delay-reason-results hidden';
            inputWrap.appendChild(input);
            inputWrap.appendChild(icon);
            wrap.appendChild(inputWrap);
            wrap.appendChild(results);
            row.appendChild(wrap);

            const closeResults = () => results.classList.add('hidden');
            const setResultsState = (message) => {
                results.innerHTML = `<div class="lookup-state">${escapeHtml(message)}</div>`;
                results.classList.remove('hidden');
            };
            const renderResults = (rows) => {
                const f = CONFIG.delayReasonFields;
                const idFields = f.idAliases || [f.id];
                const nameFields = f.nameAliases || [f.name];
                const html = rows.map(item => {
                    const id = firstRawValue(item, idFields, '');
                    const label = firstDisplayValue(item, nameFields, id || '');
                    if (!id) return '';
                    return `<div class="lookup-result" data-id="${escapeHtml(id)}"><span class="lookup-result-icon">+</span><span class="lookup-result-label">${escapeHtml(label)}</span></div>`;
                }).join('');
                results.innerHTML = html || '<div class="lookup-state">No delay reasons</div>';
                results.classList.remove('hidden');
                results.querySelectorAll('.lookup-result').forEach(node => {
                    node.addEventListener('click', () => {
                        row.dataset.selectedDelayReasonId = node.dataset.id;
                        input.value = node.querySelector('.lookup-result-label').textContent;
                        closeResults();
                    });
                });
            };
            const loadResults = async (query) => {
                setResultsState('Searching...');
                try {
                    const response = await DataverseService.searchDelayReasons(query);
                    renderResults(safeGet(response, 'value', []));
                } catch (err) {
                    console.error('Delay reason search failed', err);
                    setResultsState('Delay reason search failed');
                }
            };
            const debouncedLoadResults = debounce((query) => loadResults(query), 350);

            input.addEventListener('input', (event) => {
                row.dataset.selectedDelayReasonId = '';
                debouncedLoadResults(event.target.value.trim());
            });
            input.addEventListener('focus', () => loadResults(input.value.trim()));
            input.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter') return;
                event.preventDefault();
                loadResults(input.value.trim());
            });
            document.addEventListener('click', (event) => {
                if (!wrap.contains(event.target)) closeResults();
            });

            row.lookupInput = input;
            return row;
        }
