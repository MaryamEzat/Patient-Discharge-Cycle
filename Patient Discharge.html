        function applyPhysicalForwardDefaults(payload, activity) {
            ['and_didyoureceivethedischargesummary', 'and_didyoureceiveyourhomemedications', 'and_doyouhaveafollowupappointment'].forEach(field => {
                if (!isBlank(payload[field]) || !isBlank(activity[field])) return;
                payload[field] = CONFIG.choices.yesNoNotDone.notDone;
            });
        }

        function collectActivityPayload(form) {
            const payload = {};
            form.querySelectorAll('[data-field]').forEach(control => {
                const field = control.dataset.field;
                if (!field || field === 'crad2_status' || isBlank(control.value)) return;
                if (control.dataset.type === 'number') payload[field] = parseInt(control.value);
                else if (control.dataset.type === 'boolean') payload[field] = control.value === 'true';
                else payload[field] = control.value;
            });
            return payload;
        }

        function renderYesNoSelect(name, value) { const div = document.createElement('div'); div.className = 'form-row'; const label = document.createElement('div'); label.className = 'label'; label.textContent = name.replace(/^and_/, '').replace(/([a-z])([A-Z])/g, '$1 $2'); const select = document.createElement('select'); select.name = name; select.innerHTML = `<option value="">Select</option><option value="${CONFIG.choices.yesNoNotDone.yes}">Yes</option><option value="${CONFIG.choices.yesNoNotDone.no}">No</option><option value="${CONFIG.choices.yesNoNotDone.notDone}">Not Done</option>`; if (value !== undefined && value !== null) select.value = value; div.appendChild(label); div.appendChild(select); return div; }

        async function captureDischargeWorkflowState(patientId) {
            const [parent, activitiesResp] = await Promise.all([
                DataverseService.getPatientDischarge(patientId),
                DataverseService.getActivities(patientId)
            ]);
            return { parent, activities: safeGet(activitiesResp, 'value', []) };
        }

        function applyDischargeWorkflowState(snapshot) {
            if (!snapshot || !snapshot.parent) return;
            State.selectedPatient = snapshot.parent;
            State.activities = snapshot.activities || [];
            $id('patientHeader').textContent = `${snapshot.parent[CONFIG.fields.patientName] || ''} - ${snapshot.parent[CONFIG.fields.name] || ''}`;
            renderPatientSummary(snapshot.parent);
            renderActivityTimeline(State.activities);
            renderCurrentActivity(State.activities);
            updateLastUpdated();
        }

        async function pollDischargeWorkflow(patientId, baselineSnapshot, { intervalMs = CONFIG.polling.intervalMs, timeoutMs = CONFIG.polling.timeoutMs, targetActivityId = null } = {}) {
            const start = Date.now();
            const baselineSignal = workflowSignal(baselineSnapshot, targetActivityId);
            let latest = baselineSnapshot;
            while (Date.now() - start < timeoutMs) {
                await delay(intervalMs);
                try {
                    latest = await captureDischargeWorkflowState(patientId);
                    if (workflowSignal(latest, targetActivityId) !== baselineSignal) {
                        return { changed: true, snapshot: latest };
                    }
                } catch (e) {
                    console.error('workflow poll error', e);
                }
            }
            return { changed: false, snapshot: latest };
        }

        function showUpdatingWorkflow() {
            const modalRoot = $id('modalRoot');
            modalRoot.innerHTML = `<div class="modal-backdrop"></div><div class="modal"><div><div class="activity-title">Updating discharge workflow...</div><div class="small" style="margin-top:6px">Waiting for the existing Power Automate workflow to process the saved activity.</div></div></div>`;
        }

        function showWorkflowStillProcessing() {
            const modalRoot = $id('modalRoot');
            modalRoot.innerHTML = `<div class="modal-backdrop"></div><div class="modal"><div><div class="activity-title">Activity saved. Workflow update is still processing.</div><div class="small" style="margin-top:6px">Refresh the discharge after a moment to check for the next activity.</div><div class="form-actions" style="margin-top:16px"><button id="refreshWorkflowNow" class="btn-primary">Refresh</button><button id="closeWorkflowMessage">Close</button></div></div></div>`;
            const refresh = $id('refreshWorkflowNow');
            if (refresh) refresh.addEventListener('click', async () => {
                if (!State.selectedPatient) return;
                modalRoot.innerHTML = '';
                await refreshPatientWorkspace({ forceDataset: true });
            });
            const close = $id('closeWorkflowMessage');
            if (close) close.addEventListener('click', () => { modalRoot.innerHTML = ''; });
        }

        function disable(btn, val) { btn.disabled = val; }
        function delay(ms) { return new Promise(res => setTimeout(res, ms)); }
        function debounce(fn, wait) { let t; return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); }; }

        async function renderEarlyDischarge() {
            const header = $id('earlyDraftHeader');
            const controls = $id('earlyControls');
            const list = $id('earlyList');
            header.innerHTML = '<div class="small">Loading early discharge drafts...</div>';
            controls.innerHTML = '';
            list.innerHTML = '';
            try {
                const resp = await DataverseService.getEarlyDischarges({ top: 100 });
                const drafts = safeGet(resp, 'value', []);

                if (!drafts.length) {
                    header.innerHTML = '<div class="small">No Early Discharge drafts are available.</div>';
                    return;
                }

                const ef = CONFIG.earlyFields;
                header.innerHTML = `<div class="activity-head"><div><div class="activity-title">Active Early Discharges</div></div><div class="small">Rows: ${drafts.length}</div></div>`;
                controls.innerHTML = '';

                const table = document.createElement('table');
                table.className = 'worklist-table';
                const thead = document.createElement('thead');
                thead.innerHTML = `<tr><th>Discharge Date</th><th>Status</th><th>Count Of Patients</th><th>Submission Date</th><th>Submitted By</th></tr>`;
                table.appendChild(thead);
                const tbody = document.createElement('tbody');
                drafts.forEach(draft => {
                    const tr = document.createElement('tr');
                    const dischargeDate = firstDisplayDateTime(draft, [ef.dischargeDate, ef.alternateDate, ef.createdOn], '-');
                    const status = displayChoice(draft, CONFIG.tables.early, ef.status, '-');
                    const count = firstDisplayValue(draft, [ef.countOfPatients], '0');
                    const submissionDate = firstDisplayDateTime(draft, [ef.submissionDate], '-');
                    const submittedBy = displayValue(draft, ef.submittedBy, null, '-');
                    tr.innerHTML = `<td>${escapeHtml(dischargeDate)}</td><td><span class="status-badge ${getStatusClass(status, draft[ef.status])}">${escapeHtml(status)}</span></td><td>${escapeHtml(count)}</td><td>${escapeHtml(submissionDate)}</td><td>${escapeHtml(submittedBy)}</td>`;
                    tr.addEventListener('click', () => openEarlyDraftWorkspace(draft));
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                list.innerHTML = '';
                list.appendChild(table);
                const rowCount = document.createElement('div');
                rowCount.className = 'small';
                rowCount.style.padding = '12px 16px';
                rowCount.textContent = `Rows: ${drafts.length}`;
                list.appendChild(rowCount);

            } catch (e) {
                console.error('Early Discharge load failed', e);
                header.innerHTML = '<div class="small">Unable to load early discharge drafts.</div><div style="margin-top:8px"><button id="retryEarly" class="btn-primary small">Retry</button></div>';
                setTimeout(() => { const btn = $id('retryEarly'); if (btn) btn.addEventListener('click', () => renderEarlyDischarge()); }, 100);
            }
        }

        function getEarlyDraftDisplayData(draft) {
            const ef = CONFIG.earlyFields;
            return {
                id: draft[ef.id],
                dischargeDate: firstDisplayDateTime(draft, [ef.dischargeDate, ef.alternateDate, ef.createdOn], '-'),
                status: displayChoice(draft, CONFIG.tables.early, ef.status, '-'),
                count: firstDisplayValue(draft, [ef.countOfPatients], '0'),
                submissionDate: firstDisplayDateTime(draft, [ef.submissionDate], '-'),
                submittedBy: displayValue(draft, ef.submittedBy, null, '-'),
                createdDate: displayDateTime(draft, ef.createdOn, '-')
            };
        }

        function openEarlyDraftWorkspace(draft) {
            State.selectedEarlyDraft = draft;
            switchTab('earlyPanel');
            renderEarlyDraftWorkspace(draft);
        }

        function getInpatientDisplayData(row) {
            const f = CONFIG.inpatientFields;
            return {
                id: row[f.id],
                patientCode: displayValue(row, f.name, null, ''),
                patientId: displayValue(row, f.patientId, null, '') || displayValue(row, f.name, null, ''),
                patientName: displayValue(row, f.patientName, null, ''),
                visitId: displayValue(row, f.visitId, null, ''),
                room: displayValue(row, f.room, null, ''),
                bed: displayValue(row, f.bed, null, ''),
                nurseStation: firstDisplayValue(row, CONFIG.inpatientAliases.nurseStation, ''),
                physician: displayValue(row, f.physician, null, ''),
                admissionDoctor: firstDisplayValue(row, CONFIG.inpatientAliases.admissionDoctor, ''),
                specialty: displayValue(row, f.specialty, null, ''),
                admissionDate: displayDateTime(row, f.admissionDate, '')
            };
        }

        function getEarlyPatientDisplayData(row) {
            const f = CONFIG.earlyIpdFields;
            const inpatient = row.__inpatient ? getInpatientDisplayData(row.__inpatient) : {};
            const childName = displayValue(row, f.name, null, '');
            const dateLikeName = /^\d{4}-\d{2}-\d{2}$/.test(childName);
            return {
                id: row[f.id],
                dischargeType: displayChoice(row, CONFIG.tables.earlyIpd, f.dischargeType, ''),
                patientCode: inpatient.patientCode || firstDisplayValue(row, [f.patientCodeValue], '') || (dateLikeName ? '' : childName),
                patientName: inpatient.patientName || '',
                visitId: displayValue(row, f.visitId, null, '') || inpatient.visitId || '',
                room: inpatient.room || '',
                bed: inpatient.bed || '',
                nurseStation: inpatient.nurseStation || '',
                physician: inpatient.physician || '',
                admissionDoctor: inpatient.admissionDoctor || '',
                specialty: inpatient.specialty || '',
                admissionDate: inpatient.admissionDate || '',
                cancellationReason: displayValue(row, f.cancellationReason, null, ''),
                isSubmitted: displayValue(row, f.isSubmitted, null, '')
            };
        }

        function buildEarlyPatientPayload(inpatient, dischargeType) {
            const src = getInpatientDisplayData(inpatient);
            const f = CONFIG.earlyIpdFields;
            const patientCode = src.patientCode || src.patientId || src.patientName;
            const payload = {};
            payload[f.dischargeType] = Number(dischargeType);
            if (!isBlank(patientCode)) payload[f.name] = patientCode;
            if (!isBlank(src.visitId)) payload[f.visitId] = src.visitId;
            if (!isBlank(src.id)) payload.__inpatientId = src.id;
            return payload;
        }

        function isDuplicateDataverseError(err) {
            const body = ((err && err.body) || (err && err.message) || '').toString().toLowerCase();
            return body.includes('duplicate') || body.includes('already') || body.includes('unique') || body.includes('cannot insert');
        }

        async function renderEarlyDraftWorkspace(draft) {
            const d = getEarlyDraftDisplayData(draft);
            $id('earlyHeader').textContent = `Early Discharge Draft - ${d.dischargeDate}`;

            const summary = $id('earlySummary');
            summary.innerHTML = '';
            const isSubmitted = String(d.status).toLowerCase().includes('submit') || choiceEquals(draft[CONFIG.earlyFields.status], 1);
            summary.innerHTML = `
                <div class="early-overview-title">
                    <div class="summary-name">Early Discharge Draft</div>
                    <div class="summary-ref">${escapeHtml(d.dischargeDate)}</div>
                </div>
                <div class="early-metric"><div class="summary-label">Status</div><div class="summary-value"><span class="status-badge ${getStatusClass(d.status, draft[CONFIG.earlyFields.status])}">${escapeHtml(d.status)}</span></div></div>
                <div class="early-metric"><div class="summary-label">Patients</div><div id="earlyPatientCount" class="summary-value">${escapeHtml(d.count)}</div></div>
                <div class="early-metric"><div class="summary-label">Created</div><div class="summary-value">${escapeHtml(d.createdDate)}</div></div>
                <div class="early-metric"><div class="summary-label">Submission</div><div class="summary-value">${escapeHtml(d.submissionDate)}</div></div>
                <div class="early-metric"><div class="summary-label">Submitted By</div><div class="summary-value">${escapeHtml(d.submittedBy)}</div></div>
                <div class="early-submit-area"><button id="submitEarlyDraft" class="btn-submit" ${isSubmitted ? 'disabled' : ''}>Submit Draft</button></div>`;
            $id('earlyCurrent').innerHTML = `
                <div class="early-panel-head"><div><div class="panel-label">Add Patient</div><div class="early-panel-title">Draft Entry</div></div><div class="status-badge ${getStatusClass(d.status, draft[CONFIG.earlyFields.status])}">${escapeHtml(d.status)}</div></div>
                <div class="draft-form">
                    <div class="form-row"><div class="label">Discharge Type</div><select id="earlyDischargeType" ${isSubmitted ? 'disabled' : ''}><option value="">Select type</option><option value="1">Early</option><option value="2">Planned</option></select></div>
                    <div class="form-row"><div class="label">Patient Search</div><input id="earlyPatientSearch" placeholder="Search inpatient by patient code or name" disabled /></div>
                    <div id="earlyPatientResults" class="draft-patient-list"><div class="small">${isSubmitted ? 'Submitted drafts are read-only.' : 'Select a discharge type to enable patient search.'}</div></div>
                    <div id="earlySelectedPatient" class="small"></div>
                    <div class="form-actions"><button id="addEarlyPatient" class="btn-primary" disabled>Add Patient</button></div>
                </div>`;
            $id('earlyDraftDetails').innerHTML = `<div class="early-panel-head"><div><div class="panel-label">Patients In Draft</div><div class="early-panel-title">Draft Patient List</div></div><div id="earlyRecordedCount" class="small">${escapeHtml(d.count)} recorded</div></div><div id="earlyDraftPatients" class="draft-existing"><div class="small">Loading patients...</div></div>`;
            await renderEarlyDraftPatients(d.id);
            bindEarlyDraftForm(draft, isSubmitted);
        }

        async function renderEarlyDraftPatients(parentId) {
            const el = $id('earlyDraftPatients');
            if (!el) return;
            try {
                const resp = await DataverseService.getEarlyDischargePatients(parentId);
                const rows = safeGet(resp, 'value', []);
                if (!rows.length) {
                    el.innerHTML = '<div class="small">No patients have been added to this draft.</div>';
                    State.earlyDraftPatients = [];
                    await syncEarlyDraftCount(parentId, 0);
                    return;
                }
                const hydratedRows = await Promise.all(rows.map(async row => {
                    const inpatientId = row[CONFIG.earlyIpdFields.patientCodeValue];
                    if (inpatientId) {
                        try { row.__inpatient = await DataverseService.getInpatientById(inpatientId); }
                        catch (e) { console.warn('Unable to hydrate inpatient row', inpatientId, e); }
                    }
                    return row;
                }));
                State.earlyDraftPatients = hydratedRows;
                await syncEarlyDraftCount(parentId, hydratedRows.length);
                el.innerHTML = `<table class="worklist-table"><thead><tr><th>Discharge Type</th><th>Patient Code</th><th>Patient Name</th><th>Visit ID</th><th>Room</th><th>Bed</th><th>Nurse Station</th><th>Physician</th><th>Admission Doctor</th><th>Specialty</th><th>Admission Date</th><th>Cancellation Reason</th><th>Submitted</th></tr></thead><tbody>${hydratedRows.map(row => {
                    const p = getEarlyPatientDisplayData(row);
                    return `<tr><td>${escapeHtml(p.dischargeType || '-')}</td><td>${escapeHtml(p.patientCode || '-')}</td><td class="patient-name-col"><div class="name">${escapeHtml(p.patientName || '-')}</div></td><td>${escapeHtml(p.visitId || '-')}</td><td>${escapeHtml(p.room || '-')}</td><td>${escapeHtml(p.bed || '-')}</td><td>${escapeHtml(p.nurseStation || '-')}</td><td>${escapeHtml(p.physician || '-')}</td><td>${escapeHtml(p.admissionDoctor || '-')}</td><td>${escapeHtml(p.specialty || '-')}</td><td>${escapeHtml(p.admissionDate || '-')}</td><td>${escapeHtml(p.cancellationReason || '-')}</td><td>${escapeHtml(p.isSubmitted || '-')}</td></tr>`;
                }).join('')}</tbody></table>`;
            } catch (e) {
                console.error('Unable to load early discharge patient rows', e);
                el.innerHTML = '<div class="small">Unable to load patients in this draft.</div>';
            }
        }

        async function syncEarlyDraftCount(parentId, count) {
            const countText = String(count);
            const topCount = $id('earlyPatientCount');
            const recordedCount = $id('earlyRecordedCount');
            if (topCount) topCount.textContent = countText;
            if (recordedCount) recordedCount.textContent = `${countText} recorded`;
            if (State.selectedEarlyDraft && normalizeGuid(State.selectedEarlyDraft[CONFIG.earlyFields.id]) === normalizeGuid(parentId)) {
                State.selectedEarlyDraft[CONFIG.earlyFields.countOfPatients] = count;
            }
            try {
                await DataverseService.updateEarlyDischargeCount(parentId, count);
            } catch (e) {
                console.warn('Unable to sync Early Discharge patient count', e);
            }
        }

        function renderInpatientResults(rows) {
            const results = $id('earlyPatientResults');
            const addBtn = $id('addEarlyPatient');
            State.selectedInpatient = null;
            if (addBtn) addBtn.disabled = true;
            if (!results) return;
            if (!rows.length) {
                results.innerHTML = '<div class="small">No matching inpatients found.</div>';
                return;
            }
            results.innerHTML = '';
            rows.forEach(row => {
                const p = getInpatientDisplayData(row);
                const item = document.createElement('div');
                item.className = 'patient-result';
                item.innerHTML = `<div class="name">${escapeHtml(p.patientName || p.patientCode || '-')}</div><div class="meta">Patient ID: ${escapeHtml(p.patientId || '-')} | Visit: ${escapeHtml(p.visitId || '-')} | ${escapeHtml([p.room, p.bed].filter(Boolean).join(' / ') || '-')}</div>`;
                item.addEventListener('click', () => {
                    document.querySelectorAll('.patient-result.selected').forEach(node => node.classList.remove('selected'));
                    item.classList.add('selected');
                    State.selectedInpatient = row;
                    $id('earlySelectedPatient').textContent = `${p.patientName || p.patientCode || 'Patient'} selected`;
                    const dischargeType = $id('earlyDischargeType').value;
                    if (addBtn) addBtn.disabled = !dischargeType;
                });
                results.appendChild(item);
            });
        }

        function bindEarlyDraftForm(draft, isSubmitted) {
            const typeSelect = $id('earlyDischargeType');
            const search = $id('earlyPatientSearch');
            const addBtn = $id('addEarlyPatient');
            const submitBtn = $id('submitEarlyDraft');
            if (!typeSelect || !search || !addBtn || !submitBtn) return;
            State.selectedInpatient = null;
            typeSelect.addEventListener('change', () => {
                State.selectedInpatient = null;
                addBtn.disabled = true;
                search.disabled = isSubmitted || !typeSelect.value;
                search.value = '';
                $id('earlySelectedPatient').textContent = '';
                $id('earlyPatientResults').innerHTML = typeSelect.value ? '<div class="small">Search inpatient list by patient code or name.</div>' : '<div class="small">Select a discharge type to enable patient search.</div>';
            });
            search.addEventListener('keyup', debounce(async () => {
                if (!typeSelect.value || search.value.trim().length < 2) {
                    renderInpatientResults([]);
                    $id('earlyPatientResults').innerHTML = '<div class="small">Type at least 2 characters to search.</div>';
                    return;
                }
                $id('earlyPatientResults').innerHTML = '<div class="small">Searching inpatients...</div>';
                try {
                    const resp = await DataverseService.searchInpatients(search.value.trim());
                    renderInpatientResults(safeGet(resp, 'value', []));
                } catch (e) {
                    console.error('Inpatient search failed', e);
                    $id('earlyPatientResults').innerHTML = '<div class="small">Unable to search inpatient list.</div>';
                }
            }, 350));
            addBtn.addEventListener('click', async () => {
                if (!typeSelect.value || !State.selectedInpatient) return;
                const payload = buildEarlyPatientPayload(State.selectedInpatient, typeSelect.value);
                if (isBlank(payload.__inpatientId)) {
                    showAppMessage('Patient code required', 'The selected inpatient row does not include a valid inpatient-list record id for the Patient Code lookup.', 'error');
                    return;
                }
                const existingRows = State.earlyDraftPatients || [];
                const duplicate = existingRows.some(row => normalizeGuid(row[CONFIG.earlyIpdFields.patientCodeValue]) === normalizeGuid(payload.__inpatientId));
                if (duplicate) {
                    showAppMessage('Duplicate patient', 'This patient is already added to this Early Discharge draft.', 'error');
                    return;
                }
                addBtn.disabled = true;
                addBtn.textContent = 'Adding...';
                try {
                    await DataverseService.addEarlyDischargePatient(draft[CONFIG.earlyFields.id], payload);
                    showAppMessage('Patient added', 'The inpatient row was added to this Early Discharge draft.', 'success');
                    State.selectedInpatient = null;
                    search.value = '';
                    $id('earlySelectedPatient').textContent = '';
                    $id('earlyPatientResults').innerHTML = '<div class="small">Search inpatient list by patient code or name.</div>';
                    await renderEarlyDraftPatients(draft[CONFIG.earlyFields.id]);
                } catch (e) {
                    console.error('Add early discharge patient failed', e);
                    if (isDuplicateDataverseError(e)) showAppMessage('Duplicate patient', 'This patient is already added to this Early Discharge draft.', 'error');
                    else showAppMessage('Unable to add patient', 'Dataverse rejected the Early Discharge patient row. Use Copy diagnostics for the exact column message.', 'error');
                } finally {
                    addBtn.textContent = 'Add Patient';
                    addBtn.disabled = !State.selectedInpatient;
                }
            });
            submitBtn.addEventListener('click', async () => {
                if (isSubmitted) return;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';
                try {
                    await DataverseService.submitEarlyDischarge(draft[CONFIG.earlyFields.id], { [CONFIG.earlyFields.status]: 1 });
                    showAppMessage('Draft submitted', 'The Early Discharge draft status was updated.', 'success');
                    await renderEarlyDischarge();
                    switchTab('early');
                } catch (e) {
                    console.error('Submit early discharge draft failed', e);
                    showAppMessage('Unable to submit draft', 'Dataverse rejected the draft status update.', 'error');
                } finally {
                    submitBtn.textContent = 'Submit Draft';
                    submitBtn.disabled = false;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => { init().catch(e => console.error(e)); });
        window.PatientDischargeApp = { CONFIG, DataverseService, State };
    })();
    </script>
</body>
</html>
